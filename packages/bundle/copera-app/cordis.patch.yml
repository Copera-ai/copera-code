# The dsh-copera-app bundle patch: the Copera Code product layer, applied after
# dsh-base and dsh-web-app in the `copera` profile. It switches off rows that
# reach DeepSeek-operated services or show DeepSeek-only surfaces, replaces the
# config of the rows whose values differ for Copera, and inserts the Copera
# account service and the `copera` model route.
#
# A patch replaces the targeted row's whole `config`, so each override below
# restates every key of the row it replaces. Patches cannot delete or reorder
# rows.

# ── telemetry and analytics ──────────────────────────────────────────────────

- id: session-telemetry-otel
  disabled: true

- id: otel
  disabled: true

- id: desktop-product-telemetry
  disabled: true

- id: product-analytics
  disabled: true

- id: session-log-deepseek
  disabled: true

# The settings page of the session-log upload, whose backend row is off above.
- id: ui-settings-session-log
  disabled: true

- id: plugin-package-inventory-deepseek
  disabled: true

# ── DeepSeek accounts, model routes, and web providers ──────────────────────

- id: deepseek-llm-api-extensions
  disabled: true

# Must stay off: copera-account owns `/oauth/callback` on the Host web server.
- id: deepseek-account
  disabled: true

- id: deepseek-auth
  disabled: true

- id: llm-deepseek
  disabled: true

- id: llm-deepseek-account
  disabled: true

- id: llm-pi-ai
  disabled: true

- id: web-search-deepseek
  disabled: true

- id: web-deepseek-api
  disabled: true

# ── DeepSeek-only browser surfaces and maintainer context ──────────────────

- id: ui-settings-account
  disabled: true

- id: ui-account-notifications
  disabled: true

- id: ui-settings-web-search
  disabled: true

- id: ui-settings-models
  disabled: true

- id: ui-brand-official
  disabled: true

- id: harness-dev-context
  disabled: true

- id: upstream-skills
  disabled: true

# ── plugin installation, recommendations, and feedback ─────────────────────

# Plugin Manager installs and enables npm, git, and local bundles over its
# Remote namespace; its only enabled consumer was creation-recommendations,
# whose generated pages need that installation path.
- id: plugin-manager
  disabled: true

- id: ui-plugin-manager
  disabled: true

# The model-invocable `official-plugins` skill and its one-click enable card.
- id: plugin-recommendations
  disabled: true

- id: client-ui-plugin-recommendations
  disabled: true

# Personalized pages are generated bundles installed through Plugin Manager.
- id: creation-recommendations
  disabled: true

- id: client-ui-creation-recommendations
  disabled: true

# The recommendation card host and its Settings switch have no card kinds left.
- id: action-cards
  disabled: true

- id: client-ui-action-cards
  disabled: true

# Session remarks and message ratings reach only the switched-off upload path.
- id: message-feedback
  disabled: true

- id: command-feedback
  disabled: true

- id: ui-message-feedback
  disabled: true

- id: entry-customization
  disabled: true

# The "customize DeepSeek Harness" preset.
- id: preset-cordis
  disabled: true

# ── Copera values ───────────────────────────────────────────────────────────

- id: agent-default-model
  config:
    provider: copera
    model: shikai

- id: system-prompt
  config:
    includeHarnessIdentity: false
    personaPrefix: You are Copera Code, a coding agent by Copera.

# dsh-base values with the title route pinned to the fast Copera model.
- id: session-title-llm
  config:
    targetWords: 5
    targetCjkCharacters: 10
    maxInputBytes: 4096
    maxOutputTokens: 4096
    timeoutMs: 60000
    provider: copera
    model: shikai-ultra-fast

# Agent web fetches identify as Copera Code; the other fields keep their defaults.
- id: web-fetch-http
  config:
    userAgent: !!js "'copera-code/' + (process.env.DSH_COPERA_PRODUCT_VERSION || 'unknown') + ' (+https://github.com/Copera-ai/copera-code)'"

- id: ui-theme
  config:
    preference: dark

# The startup line names the product: `Copera Code: http://…`.
- id: authentication-token
  config:
    cookieMaxAgeDays: 30
    entryLabel: Copera Code

# Copera Code language catalog: English and Brazilian Portuguese only.
- id: locale
  config:
    languages: [en, pt]
    labels:
      pt: Português (Brasil)

# ── product lock ───────────────────────────────────────────────────────────

# The guard checks the composed tree after every patch layer: the rows above
# stay off (src/product-lock.ts lists them), only the `copera` model route is
# registered, and the profile still lists this bundle. The required Web server
# injects the guard's service, so a violation, or a disabled guard, stops
# startup with the guard's message.
- insert:
    - id: copera-product-lock
      name: '@deepseek-ai/dsh-copera-app'

- id: webserver
  inject: [webStartup, coperaProductLock]

# ── Copera account and model route ──────────────────────────────────────────

# copera-account signs in through the Host web server's `/oauth/callback` and
# provides `coperaTokens`; llm-copera registers the `copera` route that
# `agent-default-model` and `session-title-llm` name and authenticates each
# request with those tokens. Both read the API origin from the launching
# process's `DSH_COPERA_API_ORIGIN` (default https://api.copera.ai).
- insert:
    - id: copera-account
      name: '@deepseek-ai/dsh-copera-account'

    - id: llm-copera
      name: '@deepseek-ai/dsh-llm-copera'

# ── Copera brand and sign-in screen ─────────────────────────────────────────

- insert:
    # Sidebar and home artwork, the blue/near-black token layer, Inter, product
    # copy overrides, and the brand mark of the sign-in screen.
    - id: ui-brand-copera
      name: '@deepseek-ai/dsh-client-ui-brand-copera'

    # The full-window sign-in screen (web and desktop) and the sidebar account
    # menu over the coperaAccount Remote namespace of copera-account.
    - id: ui-copera-account
      name: '@deepseek-ai/dsh-client-ui-copera-account'
